<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Custom Video Controls</title>
    <link rel="stylesheet" href="../styles/video.css">
</head>
<body>

<h2>Video Manipulation</h2>

<video id="myVideo">
    <source src="https://res.cloudinary.com/dr9yx1tod/video/upload/v1745958400/uploaded_Videos/video-1745958309042.mp4" type="video/mp4">
    Your browser does not support HTML5 video.
</video>

<div class="controls">
    <button onclick="playVideo()">Play</button>
    <button onclick="pauseVideo()">Pause</button>
    <button onclick="stopVideo()">Stop</button>
    <button onclick="muteVideo()">Mute / Unmute</button>

    Volume:
    <input type="range" min="0" max="1" step="0.1" value="1" onchange="changeVolume(this.value)">

    <button onclick="fullScreen()">Fullscreen</button>
</div>

<script src="../scripts/video_Control_handlers.js"></script>
</body>
</html>
