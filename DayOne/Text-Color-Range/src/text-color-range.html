<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Text Color Range</title>
    <link rel="stylesheet" href="../styles/text-color.css">
</head>
<body>

<h2>Text Color Range</h2>

<label>Red</label>
<input type="range" min="0" max="255" value="0" oninput="changeColor()">

<label>Green</label>
<input type="range" min="0" max="255" value="0" oninput="changeColor()">

<label>Blue</label>
<input type="range" min="0" max="255" value="0" oninput="changeColor()">

<p id="text">Change my color using the sliders!</p>

<script src="../scripts/text-color-range-handler.js"></script>
</body>
</html>
