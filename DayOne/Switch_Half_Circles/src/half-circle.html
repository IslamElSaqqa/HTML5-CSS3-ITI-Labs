<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Half Circle Flip</title>
    <link rel="stylesheet" href="../style/flip.css">
</head>
<body>

<h2>Half Circle Flip</h2>

<div class="circle">
    <div id="left" class="half left"></div>
    <div id="right" class="half right"></div>
</div>

<button onclick="flip()">Flip</button>

<script>
    let flipped = false;
    let count = 0;

    function flip() {
        if (count === 10) {
            document.getElementById("left").classList.add("full");
            document.getElementById("right").classList.add("full");
            return;
        }

        flipped = !flipped;
        document.getElementById("left").style.display = flipped ? "none" : "block";
        document.getElementById("right").style.display = flipped ? "block" : "none";
        count++;
    }
</script>

</body>
</html>
