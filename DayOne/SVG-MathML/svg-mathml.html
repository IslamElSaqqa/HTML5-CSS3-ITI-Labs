<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SVG & MathML</title>
</head>
<body>

<h2>SVG Right Triangle</h2>

<svg width="300" height="200">

    <polygon points="50,150 250,150 250,50"
                fill="Red"
                stroke="black"
                stroke-width="2" 
    />

    <!-- Labels -->
    <text x="140" y="165">a</text>
    <text x="255" y="110">b</text>
    <text x="150" y="80">c</text>
</svg>

<h2>MathML – Pythagoras Theorem</h2>

<math xmlns="http://www.w3.org/1998/Math/MathML">
    <msup>
        <mi>a</mi>
        <mn>2</mn>
    </msup>
    <mo>+</mo>
    <msup>
        <mi>b</mi>
        <mn>2</mn>
    </msup>
    <mo>=</mo>
    <msup>
        <mi>c</mi>
        <mn>2</mn>
    </msup>
</math>

</body>
</html>
